# The one home for "stand up the workspace on a runner": pnpm (version from
# package.json > packageManager), node (version from .nvmrc, pnpm store cached),
# a frozen install, and the turbo task cache.
#
# The turbo cache has one policy, held here so it can't drift per-job:
#   restore (default) — read the newest cache, never upload. PR-branch saves are
#     scoped to that branch (sibling PRs can't restore them), so PR uploads are
#     pure churn against the repo's 10GB cache quota. The release and the
#     install check also restore-only.
#   save — restore, prune entries a couple weeks stale (turbo never GCs its own
#     cache dir), and upload after the job. Used by exactly one job: CI validate
#     on a push to main, the run every later PR restores from.
#
# Checkout stays outside — fetch-depth varies by caller.
name: Setup workspace
description: pnpm + node + frozen install + the turbo cache policy

inputs:
  turbo-cache:
    description: "'restore' (default) or 'save' — see the policy note above"
    default: restore
  npm-token:
    description: >-
      The NPM_TOKEN repository secret: publish rights to the @beaconsgg scope on npm. A composite action cannot read secrets, so every caller passes it.
      Empty in a Dependabot-triggered run, which gets Dependabot's secrets (none), not Actions'.
    default: ""
  npm-token-required:
    description: >-
      'true' fails the job on an empty token instead of warning. The release needs that. An
      install here fetches nothing from the registry (every @beaconsgg/* package is a
      workspace member), so it succeeds without the token, and a Dependabot PR's CI must too.
    default: "false"
  npm-login:
    description: >-
      'false' skips the registry login on purpose, with no warning. The install check uses this,
      so that its jobs never write a token for a real registry and a canary can only go to the
      throwaway one.
    default: "true"

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6

    - uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: pnpm

    # One line in the user config, never in the committed .npmrc (pnpm drops that whole file when a
    # ${VAR} in it is unset; see .npmrc). An empty token is said out loud rather than left to
    # surface as a 401 on the first registry fetch, which for a plain install here is no fetch at
    # all: a warning where the job can do without it, a failure where it cannot (publishing).
    - name: Log in to npm
      if: inputs.npm-login != 'false'
      run: |
        if [ -z "$NPM_TOKEN" ]; then
          if [ "$REQUIRED" = "true" ]; then
            echo "::error::npm-token is empty: pass secrets.NPM_TOKEN to setup-workspace"
            exit 1
          fi
          echo "::warning::npm-token is empty (a Dependabot run, or the secret is missing): no registry login; fine for a job that only installs"
          exit 0
        fi
        printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" >> ~/.npmrc
      env:
        NPM_TOKEN: ${{ inputs.npm-token }}
        REQUIRED: ${{ inputs.npm-token-required }}
      shell: bash

    - run: pnpm install --frozen-lockfile
      shell: bash

    - if: inputs.turbo-cache == 'save'
      uses: actions/cache@v6
      with:
        path: .turbo
        key: turbo-${{ runner.os }}-${{ github.sha }}
        restore-keys: turbo-${{ runner.os }}-

    - if: inputs.turbo-cache == 'save'
      name: Prune stale turbo cache entries
      run: "[ -d .turbo/cache ] && find .turbo/cache -type f -mtime +14 -delete || true"
      shell: bash

    - if: inputs.turbo-cache == 'restore'
      uses: actions/cache/restore@v6
      with:
        path: .turbo
        key: turbo-${{ runner.os }}-${{ github.sha }}
        restore-keys: turbo-${{ runner.os }}-
